<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Course Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">📚 Course Manager</div>
        <p class="auth-subtitle">Create a new account</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="id">Student ID <span style="color:var(--text-sub);font-weight:400">(max 9 chars)</span></label>
                <input id="id" type="text" class="form-control" th:field="*{id}" placeholder="e.g. B12345678" autofocus maxlength="9"/>
            </div>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input id="name" type="text" class="form-control" th:field="*{name}" placeholder="Your full name"/>
            </div>
            <div class="form-group">
                <label for="departmentId">Department</label>
                <input id="departmentId" type="text" class="form-control"
                       th:field="*{departmentId}"
                       placeholder="Type or select department"
                       list="departmentList"/>
                <datalist id="departmentList">
                    <option th:each="d : ${departmentIdList}" th:value="${d.id}" th:label="${d.id}"></option>
                </datalist>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" th:field="*{password}" placeholder="Create a password"/>
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>
</div>

</body>
</html>
