<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Course Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">📚 Course Manager</div>
        <p class="auth-subtitle">Sign in to your account</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form th:action="@{/login}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="id">Student ID</label>
                <input id="id" type="text" class="form-control" th:field="*{id}" placeholder="Enter your ID" autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" th:field="*{password}" placeholder="Enter your password"/>
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">Sign In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Create one</a>
        </p>
    </div>
</div>

</body>
</html>
