<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home — Course Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="page" style="max-width:560px">
    <div class="card" style="padding:32px 36px">
        <div style="text-align:center;margin-bottom:28px">
            <div style="font-size:48px;margin-bottom:12px">👋</div>
            <h1 style="font-size:20px;font-weight:700;margin-bottom:4px">Welcome back</h1>
            <p style="color:var(--text-sub);font-size:14px">
                Signed in as <strong th:text="${user.id}"></strong>
                &nbsp;·&nbsp;
                <span th:text="${user.departmentId}"></span>
            </p>
        </div>

        <div class="nav-grid">
            <a th:href="@{/profile}" class="nav-card">
                <span class="nav-card-icon">👤</span>
                <span>Profile</span>
            </a>
            <a th:href="@{/course/search}" class="nav-card">
                <span class="nav-card-icon">🔍</span>
                <span>Search Courses</span>
            </a>
            <a th:href="@{/course/myCourse}" class="nav-card">
                <span class="nav-card-icon">📋</span>
                <span>My Courses</span>
            </a>
            <a th:href="@{/logout}" class="nav-card danger">
                <span class="nav-card-icon">🚪</span>
                <span>Logout</span>
            </a>
        </div>
    </div>
</div>

</body>
</html>
