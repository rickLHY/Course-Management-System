# ===================================================
# Dev profile — H2 in-memory database (no MySQL needed)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ===================================================

# H2 datasource (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:coursemanager;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=TIME
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-run schema.sql and data.sql
spring.sql.init.mode=always

# H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8082

spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
